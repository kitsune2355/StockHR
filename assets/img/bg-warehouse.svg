<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" aria-label="ภาพประกอบคลังสินค้า ชั้นวาง กล่องสินค้า และพาเลท">

  <!-- ============================================================
       bg-warehouse.svg — ภาพพื้นหลังของระบบสต็อก Uniform
       ใช้เป็นพื้นหลังเบลอในพื้นที่เนื้อหา (ตั้งค่าที่ตัวแปร app-bg-image ใน app.css)
       หมายเหตุ: ห้ามพิมพ์ขีดกลางติดกันสองตัวในคอมเมนต์ XML ไฟล์จะพังทั้งไฟล์

       ออกแบบมาให้ "อ่านรู้เรื่องตอนเบลอ" จึงใช้รูปทรงใหญ่ ๆ ตัดกันชัด
       ไม่มีรายละเอียดเล็กที่จะหายไปหมดเมื่อเบลอ 26px

       พื้นหลังโปร่งใส ไม่ได้ทาสีพื้น เพื่อให้ไล่สีเขียว 2 จุดที่กำหนดไว้
       ใน app.css มองทะลุขึ้นมาผสมได้ และให้ปรับความเข้มด้วย opacity
       จากฝั่ง CSS ได้อิสระ

       สีทั้งหมดมาจาก palette brand ของระบบ (#0891b2 เป็นตัวหลัก)
       ============================================================ -->

  <defs>
    <linearGradient id="boxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="boxFrontDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>

    <linearGradient id="boxLid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="rackSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#155e75"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>

    <!-- กล่องสินค้า 1 ใบ : ตัวกล่อง + ฝาบน + เทปกลาง -->
    <symbol id="carton" viewBox="0 0 120 100">
      <rect x="0"  y="14" width="120" height="86" rx="6"  fill="url(#boxFront)"/>
      <rect x="0"  y="0"  width="120" height="20" rx="5"  fill="url(#boxLid)"/>
      <rect x="52" y="14" width="16"  height="86"         fill="#ecfeff" opacity=".55"/>
      <rect x="0"  y="14" width="120" height="6"          fill="#083344" opacity=".12"/>
    </symbol>

    <!-- กล่องทรงสูง -->
    <symbol id="cartonTall" viewBox="0 0 100 140">
      <rect x="0"  y="16" width="100" height="124" rx="6" fill="url(#boxFrontDeep)"/>
      <rect x="0"  y="0"  width="100" height="22"  rx="5" fill="url(#boxLid)"/>
      <rect x="42" y="16" width="16"  height="124"        fill="#ecfeff" opacity=".45"/>
    </symbol>

    <!-- พาเลทไม้ -->
    <symbol id="pallet" viewBox="0 0 260 34">
      <rect x="0"   y="0"  width="260" height="12" rx="3" fill="#155e75"/>
      <rect x="10"  y="16" width="34"  height="18" rx="3" fill="#083344"/>
      <rect x="113" y="16" width="34"  height="18" rx="3" fill="#083344"/>
      <rect x="216" y="16" width="34"  height="18" rx="3" fill="#083344"/>
    </symbol>
  </defs>


  <!-- ============================================================
       ชั้นวางสินค้าฝั่งซ้าย — เสา 2 ต้น คาน 3 ชั้น
       ============================================================ -->
  <g opacity=".85">
    <rect x="120" y="150" width="26"  height="600" rx="6" fill="url(#rackSteel)"/>
    <rect x="600" y="150" width="26"  height="600" rx="6" fill="url(#rackSteel)"/>
    <rect x="120" y="330" width="506" height="18" rx="5" fill="#155e75"/>
    <rect x="120" y="520" width="506" height="18" rx="5" fill="#155e75"/>
    <rect x="120" y="732" width="506" height="18" rx="5" fill="#155e75"/>

    <!-- ชั้นบน -->
    <use href="#carton" x="170" y="230" width="120" height="100"/>
    <use href="#carton" x="310" y="230" width="120" height="100"/>
    <use href="#cartonTall" x="460" y="190" width="100" height="140"/>

    <!-- ชั้นกลาง -->
    <use href="#cartonTall" x="160" y="380" width="100" height="140"/>
    <use href="#carton" x="290" y="420" width="120" height="100"/>
    <use href="#carton" x="430" y="420" width="120" height="100"/>

    <!-- ชั้นล่าง -->
    <use href="#carton" x="150" y="632" width="120" height="100"/>
    <use href="#carton" x="290" y="632" width="120" height="100"/>
    <use href="#cartonTall" x="440" y="592" width="100" height="140"/>
  </g>


  <!-- ============================================================
       กองสินค้าบนพาเลท กลางภาพ
       ============================================================ -->
  <g opacity=".9">
    <use href="#pallet" x="700" y="750" width="260" height="34"/>
    <use href="#carton"     x="712" y="650" width="120" height="100"/>
    <use href="#carton"     x="838" y="650" width="120" height="100"/>
    <use href="#cartonTall" x="760" y="510" width="100" height="140"/>
    <use href="#carton"     x="870" y="550" width="120" height="100"/>
  </g>


  <!-- ============================================================
       กองสินค้าฝั่งขวา — สูงกว่า สร้างจังหวะให้ภาพ
       ============================================================ -->
  <g opacity=".8">
    <use href="#pallet" x="1130" y="750" width="260" height="34"/>
    <use href="#cartonTall" x="1140" y="610" width="100" height="140"/>
    <use href="#cartonTall" x="1250" y="610" width="100" height="140"/>
    <use href="#carton"     x="1160" y="510" width="120" height="100"/>
    <use href="#carton"     x="1286" y="510" width="120" height="100"/>
    <use href="#cartonTall" x="1200" y="370" width="100" height="140"/>
  </g>


  <!-- ============================================================
       กล่องลอยด้านบน — ทำให้ตอนเบลอมีน้ำหนักกระจายทั้งภาพ
       ไม่ใช่หนักที่ขอบล่างอย่างเดียว
       ============================================================ -->
  <g opacity=".45">
    <use href="#carton"     x="1030" y="150" width="120" height="100"/>
    <use href="#cartonTall" x="1420" y="180" width="100" height="140"/>
    <use href="#carton"     x="780"  y="230" width="120" height="100"/>
  </g>


  <!-- ============================================================
       เส้นบอกทางเดินบนพื้นคลัง
       ============================================================ -->
  <g opacity=".35" fill="none" stroke="#0891b2" stroke-width="10" stroke-linecap="round">
    <path d="M60 820 H1540"/>
    <path d="M60 862 H1200" stroke-dasharray="60 44"/>
  </g>

</svg>
